<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crzgh的个人网站</title>
  <link rel="icon" href="/assets/images/crzgh.jpeg">
  <meta name="description" content="这是crzgh的网站，这个网站包括OpenBVE/Hmmsim/MTR及其他方面的内容，欢迎访问">
  <style>
  :root {
    --bg: #ffffff;
    --card: #fdfafb;
    --ink: #241b1b;
    --ink-2: #6b5757;
    --ink-3: #8c7777;
    --line: #d8c8c8;
    --red: #e60000;
    --red-deep: #b30000;
    --red-soft: #ffe6e6;
    --max-w: 1080px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--red); text-decoration: none; }
  a:hover { color: var(--red-deep); }
  .container { max-width: var(--max-w); margin: 0 auto; padding: 0 28px; }
  header.site-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    background: rgba(245,238,238,.75);
    border-bottom: 1px solid var(--line);
    transition: box-shadow .25s;
  }
  @supports ((backdrop-filter: blur(10px)) or (-webkit-backdrop-filter: blur(10px))) {
    header.site-nav {
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
  }
  header.site-nav.scrolled { box-shadow: 0 6px 24px rgba(80,20,20,.08); }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 52px;
    max-width: var(--max-w); margin: 0 auto; padding: 0 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { height: 28px; width: auto; display: block; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: .3px; }
  .nav-links { display: flex; gap: 24px; list-style: none; align-items: center; margin: 0; padding: 0; }
  .nav-links a { color: var(--ink-2); text-decoration: none; font-size: 14.5px; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--red); }
  .menu-toggle {
    display: none; border: 1px solid var(--line); background: #fff;
    color: var(--ink); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  .lang-switch {
    font-size: 13px; color: var(--red); text-decoration: none;
    border: 1px solid var(--line); padding: 4px 10px;
  }
  .lang-switch:hover { background: var(--red-soft); }
  @media (max-width: 860px) {
    .menu-toggle { display: inline-flex; align-items: center; }
    .nav-links {
      display: none; position: absolute;
      top: 52px; left: 0; right: 0;
      padding: 12px 24px 20px; background: #fff;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 12px 24px rgba(80,20,20,.08);
    }
    .nav-links.open { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
    .nav-links li { border-top: 1px solid var(--line); }
    .nav-links li:first-child { border-top: 0; }
    .nav-links a { display: block; padding: 10px 0; }
    .nav-links .lang-switch { display: inline-block; margin-top: 8px; padding: 5px 14px; }
  }
  #fallingContainer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
  }
  .falling-cake {
    position: absolute;
    top: -50px;
    font-size: 18px;
    animation: fall linear infinite;
  }
  .falling-text {
    position: absolute;
    top: -30px;
    color: red;
    font-size: 14px;
    font-weight: bold;
    animation: fall linear infinite;
  }
  @keyframes fall {
    from { transform: translateY(0); }
    to { transform: translateY(110vh); }
  }
  </style>
</head>
<body>
  <div id="fallingContainer"></div>
  <header class="site-nav" id="siteNav">
    <div class="nav-inner">
      <a class="brand" href="/">
        <img src="/assets/images/crzgh.jpeg" alt="Logo">
        <span class="brand-name">crzgh</span>
      </a>
      <button class="menu-toggle" id="menuToggle" type="button" aria-controls="siteMenu" aria-expanded="false">菜单</button>
      <ul class="nav-links" id="siteMenu">
        <li><a href="/index.html">首页</a></li>
        <li><a href="https://space.bilibili.com/3546666699328210/">我的Bilibili</a></li>
        <li><a class="lang-switch" href="/en/">EN</a></li>
      </ul>
    </div>
  </header>

  <div class="container" style="text-align: center; padding-top: 80px;">
    <h1>你好，这是我的第一个网站</h1>
    <h2>正在建设中……</h2>
    <br>
    <h1>谨以此网站献给14岁的自己</h1>
    <p>由 GitHub Pages 托管</p>
    <a href="https://space.bilibili.com/3546666699328210/" target="_blank" rel="noopener noreferrer">我的B站</a>
    <br>
    <a href="ccsrc/index.html">CCSRC新官网</a>
    <br>
    <a href="https://ccsrc.dpdns.org" target="_blank" rel="noopener noreferrer">访问CCSRC官网</a>
  </div>

  <script>
    var container = document.getElementById('fallingContainer');
    var cakeEmojis = ['🎂', '🍰', '🎆', '🎇'];
    var cakeCount = 30;
    var textCount = 30;
    for (var i = 0; i < cakeCount; i++) {
      var cake = document.createElement('div');
      cake.className = 'falling-cake';
      cake.textContent = cakeEmojis[Math.floor(Math.random() * cakeEmojis.length)];
      cake.style.left = Math.random() * 100 + 'vw';
      cake.style.animationDuration = Math.random() * 3 + 3 + 's';
      cake.style.animationDelay = Math.random() * 5 + 's';
      container.appendChild(cake);
    }
    for (var i = 0; i < textCount; i++) {
      var text = document.createElement('div');
      text.className = 'falling-text';
      text.textContent = '生日快乐';
      text.style.left = Math.random() * 100 + 'vw';
      text.style.animationDuration = Math.random() * 3 + 4 + 's';
      text.style.animationDelay = Math.random() * 5 + 's';
      container.appendChild(text);
    }
    const nav = document.getElementById('siteNav');
    const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 10);
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    const menuButton = document.getElementById('menuToggle');
    const menu = document.getElementById('siteMenu');
    menuButton.addEventListener('click', () => {
      const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
      menuButton.setAttribute('aria-expanded', String(!isOpen));
      menu.classList.toggle('open', !isOpen);
    });
    menu.addEventListener('click', (event) => {
      if (event.target.closest('a')) {
        menuButton.setAttribute('aria-expanded', 'false');
        menu.classList.remove('open');
      }
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        menuButton.setAttribute('aria-expanded', 'false');
        menu.classList.remove('open');
        menuButton.focus();
      }
    });
  </script>
</body>
</html>
